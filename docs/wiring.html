<text class="sub" x="48" y="86">ESP32-C3 + TM1638 LED&amp;KEY + TTL→RS485 → DMX.  Match the labels printed on each board: header pin order varies between makers.</text>

<!-- ===== notes ===== -->
<line x1="48" y1="868" x2="1352" y2="868" stroke="#d8d4cc" stroke-width="1.5"/>
<text class="noteb" x="48" y="900">Reading this</text>
<text class="note" x="48" y="926">A dot is a connection. Tags with the same name are the same connection:</text>
<text class="note" x="48" y="948">every <tspan font-weight="700">3V3</tspan> tag goes to the C3's 3V3 pin, every <tspan font-weight="700">GND</tspan> tag to its GND pin.</text>
<text class="note" x="48" y="978">Wire colours are only to tell the wires apart.</text>
<g>
 <line class="w v33" x1="48" y1="1010" x2="88" y2="1010"/><text class="note" x="96" y="1015">3V3</text>
 <line class="w gnd" x1="150" y1="1010" x2="190" y2="1010"/><text class="note" x="198" y="1015">GND</text>
 <line class="w stb" x1="256" y1="1010" x2="296" y2="1010"/><text class="note" x="304" y="1015">STB</text>
 <line class="w clk" x1="356" y1="1010" x2="396" y2="1010"/><text class="note" x="404" y="1015">CLK</text>
 <line class="w dio" x1="456" y1="1010" x2="496" y2="1010"/><text class="note" x="504" y="1015">DIO</text>
 <line class="w tx" x1="48" y1="1044" x2="88" y2="1044"/><text class="note" x="96" y="1049">DMX out (TTL)</text>
 <line class="w dp" x1="256" y1="1044" x2="296" y2="1044"/><text class="note" x="304" y="1049">Data+</text>
 <line class="w dm" x1="376" y1="1044" x2="416" y2="1044"/><text class="note" x="424" y="1049">Data−</text>
</g>

<text class="noteb" x="720" y="900">Notes</text>
<text class="note" x="720" y="926">• Power the TM1638 from <tspan font-weight="700">3.3 V</tspan>. At 5 V it would put 5 V on GPIO 10.</text>
<text class="note" x="720" y="952">• Don't use GPIO 2, 8 or 9 for anything held at boot (strapping pins).</text>
<text class="note" x="720" y="978">• Long cable runs or several fixtures: fit a 120 Ω terminator</text>
<text class="note" x="736" y="998">across Data+ and Data− at the far end of the chain.</text>
<text class="note" x="720" y="1024">• Glitchy output? Swap the module for a MAX3485 with DE tied high.</text>
<text class="note" x="720" y="1050">• The C3 runs from USB-C. Fixtures have their own power.</text>
