<!-- ===== notes ===== -->
<line x1="48" y1="910" x2="1492" y2="910" stroke="#d8d4cc" stroke-width="1.5"/>
<text class="noteb" x="48" y="942">Reading this</text>
<text class="note" x="48" y="968">• The C3 is drawn as the board: pins where they sit, grey pins unused.</text>
<text class="note" x="48" y="994">• A dot is a joint. Each <tspan font-weight="700">5V</tspan> / <tspan font-weight="700">3V3</tspan> symbol is that pin on the C3,</text>
<text class="note" x="62" y="1014">and every ground symbol is the C3's <tspan font-weight="700">GND</tspan> pin.</text>
<text class="note" x="48" y="1040">• × means leave unconnected.</text>
<text class="note" x="48" y="1066">• Wire colours are only to tell the wires apart.</text>

<text class="noteb" x="760" y="942">Notes</text>
<text class="note" x="760" y="968">• Power the TM1638 from <tspan font-weight="700">3.3 V</tspan>. At 5 V it would put 5 V on GPIO 10.</text>
<text class="note" x="760" y="994">• Solder R1 and R2 at the C3 end. If the panel is unplugged,</text>
<text class="note" x="774" y="1014">R1 must stay behind so it reads as a fault.</text>
<text class="note" x="760" y="1040">• The transmitter runs from the C3's 5V pin (USB). Set it to TX</text>
<text class="note" x="774" y="1060">with its button, then pair the receivers at the fixtures.</text>
<text class="note" x="760" y="1086">• Glitchy output? Swap the RS485 module for a MAX3485, DE tied high.</text>
<text class="warn" x="760" y="1116" style="font-size:15px">• A receiver may hold the last scene when the link drops.</text>
<text class="warn" x="774" y="1136" style="font-size:15px">Test DMX loss through it before trusting it with a laser.</text>
