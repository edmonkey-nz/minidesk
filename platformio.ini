; minidesk: ESP32-C3 + TM1638 LED&KEY panel + RS485 -> DMX scene recall for a DMX laser.
; See CLAUDE.md for hard constraints before changing anything here.

[platformio]
default_envs = c3

[env:c3]
; pioarduino = Arduino core 3.x / ESP-IDF 5 (same platform family as lightswing)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_mode = dio
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -Wall
lib_deps =
  gavinlyonsrepo/TM1638plus@^2.2.0
  bblanchon/ArduinoJson@^7.2.0
  ; SSD1306, never SH110X: this 0.42" panel needs the SSD1306 charge-pump command.
  ; SH110X sends the SH1106 one, which the panel ignores: dark screen, no error.
  ; (Found the hard way in ../lightswing.)
  adafruit/Adafruit SSD1306@^2.5.7

; Host-side unit tests for lib/scenelogic (scene parsing, debouncing, display text).
; Run: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall
lib_deps =
  bblanchon/ArduinoJson@^7.2.0
